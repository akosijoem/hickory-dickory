<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hickory Dickory Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="sun"></div>
  <div class="cloud" style="width:110px;height:40px;top:9%;left:12%;"></div>
  <div class="cloud" style="width:70px;height:30px;top:14%;left:22%;"></div>
  <div class="cloud" style="width:90px;height:34px;top:6%;left:38%;"></div>

  <div class="title-wrap">
    <div class="title-sign"><h1>Hickory Dickory Dock</h1></div>
  </div>

  <div class="rhyme-banner" id="rhymeBanner">
    <span class="verse-tag" id="verseTag">♪</span><span id="rhymeText">Hickory dickory dock, the mouse ran up the clock! Pick an animal and drag it up to find out what happens next.</span>
  </div>

  <div class="stage" id="stage">
    <div class="tray" id="tray">
      <div class="tray-label">Pick one!</div>
      <!-- buttons injected by JS -->
    </div>

    <div class="clock-zone">
      <div class="clock-shadow"></div>
      <img id="clockImg" class="tick" src="" alt="Grandfather clock">
      <div class="crack-overlay" id="crackOverlay">
        <svg viewBox="0 0 200 200">
          <polyline points="60,10 80,70 50,90 95,140 70,190" fill="none" stroke="#3a2416" stroke-width="4" stroke-linejoin="round"/>
          <polyline points="140,20 120,80 150,100 110,150" fill="none" stroke="#3a2416" stroke-width="4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="dizzy-stars" id="dizzyStars">😵‍💫✨</div>
      <br>
      <button class="fix-btn" id="fixBtn">🔧 Fix the Clock!</button>
    </div>

  </div>

  <div class="ground"></div>
</div>

<script src="game.js"></script>
</body>
</html>
